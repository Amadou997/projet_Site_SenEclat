[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
  environment = { NODE_VERSION = "22" }

# L'API Django (Render) est relayée sous la même origine que le site : le cookie de
# refresh (HttpOnly, SameSite=Strict, Path=/api/auth/) fonctionne sans CORS.
[[redirects]]
  from = "/api/*"
  to = "https://projet-site-seneclat.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "https://projet-site-seneclat.onrender.com/media/:splat"
  status = 200
  force = true

# Routage côté client (React Router).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
